[package]
name = "knightbus-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

# GUI toolchains and native webview libraries are optional for headless builds.
[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
knightbus-sdk = { path = "../../crates/knightbus-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "=1.1.6", features = ["process"] }

[target.'cfg(windows)'.dependencies]
sha2 = "0.10.9"

[build-dependencies]
tauri-build = "2"

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
