[workspace]
members = [
    "crates/knightbus-usbip",
    "crates/knightbus-usb",
    "crates/knightbus-core",
    "crates/knightbus-ipc",
    "crates/knightbus-transport",
    "crates/knightbus-windows-protocol",
    "crates/importers/knightbus-windows-importer",
    "crates/exporters/knightbus-macos-exporter",
]
exclude = ["crates/knightbus-usbip/tests/fuzz", "drivers/windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/marcosmmb/knightbus"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
