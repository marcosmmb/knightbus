# Replace paths, addresses, and the registry generation from local-list.
role=exporter
state=/absolute/private/knightbus/identity
usb=192.0.2.10:3337
control=192.0.2.10:3338
registry=0x12345678
capture=true
# Required only after cleanly unmounting every volume of a storage device:
# storage_unmounted=true
# Initially no device is shared. Repeat grant only for explicitly paired peers:
# grant=CONFIRMED_64_HEX_IMPORTER_FINGERPRINT
# Optional with the knightbus-sdk/mdns build feature and a concrete LAN address:
# mdns_name=knightbus-exporter
