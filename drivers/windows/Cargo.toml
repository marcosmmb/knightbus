[package]
name = "knightbus-windows-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT"
description = "Original KnightBus UDE controller"
build = "build.rs"

[workspace]

[lib]
crate-type = ["cdylib"]

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[dependencies]
wdk-sys = { git = "https://github.com/microsoft/windows-drivers-rs", rev = "04523040779d80125f280c4f9421f54a6059f470", features = ["usb"] }
wdk-panic = { git = "https://github.com/microsoft/windows-drivers-rs", rev = "04523040779d80125f280c4f9421f54a6059f470" }

[build-dependencies]
wdk-build = { git = "https://github.com/microsoft/windows-drivers-rs", rev = "04523040779d80125f280c4f9421f54a6059f470" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
# Kernel stacks are small; unoptimized generic Rust frames are not loadable.
opt-level = 1
debug = 2
panic = "abort"

[profile.release]
debug = 1
panic = "abort"
